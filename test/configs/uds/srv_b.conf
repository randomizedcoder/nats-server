# Cluster Server B: routes over Unix domain sockets.
#
# Used by scripts/uds-cluster-smoke.sh. The socket directory must be short
# enough to fit in sun_path (107 bytes on Linux including the file name).

server_name: uds-b
listen: 127.0.0.1:14223
http: 127.0.0.1:18223

cluster {
  name: uds
  listen: "unix:///tmp/nats-uds/b.sock"

  # Explicit routes form the mesh. A unix listener advertises nothing by
  # default, so every edge that should exist is listed here.
  routes = [
    "unix:///tmp/nats-uds/a.sock"
    "unix:///tmp/nats-uds/c.sock"
  ]
}

no_sys_acc: true
