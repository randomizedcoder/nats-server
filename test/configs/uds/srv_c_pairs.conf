# Cluster Server C: ring topology through a proxy (UDS_PAIRS=1).
#
# Used by scripts/uds-cluster-smoke.sh with UDS_PAIRS=1. Each server dials
# exactly one socket, the near end of a proxy pair (socat locally, or the
# uds-over-rdma-proxy across hosts). The proxy connects the far end to the
# next server's listener, so the three explicit routes form a ring and the
# servers never open a socket to each other directly.

server_name: uds-c
listen: 127.0.0.1:14224
http: 127.0.0.1:18224

cluster {
  name: uds
  listen: "unix:///tmp/nats-uds/c.sock"
  routes = [
    "unix:///tmp/nats-uds/ca.sock"
  ]
}

no_sys_acc: true
