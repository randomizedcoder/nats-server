# .golangci-comprehensive.yml
#
# Tier 2 (comprehensive) golangci-lint config — a SUPERSET of the gating
# .golangci.yml. Not run by CI or by default `nix flake check`; invoked via
# `nix run .#lint-comprehensive` or `nix build .#golangci-lint-comprehensive`.
#
# It keeps everything the gating config enables and its exclusions, and adds a
# batch of advisory linters. Expect findings — this tier is for triage, not
# gating. Keep the gating .golangci.yml as the authoritative CI config.
#
version: "2"
run:
  concurrency: 4
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
  timeout: 15m
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    # --- gating set (kept identical to .golangci.yml) ---
    - forbidigo
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
    # --- comprehensive additions (advisory) ---
    - gosec
    - gocritic
    - revive
    - unconvert
    - prealloc
    - gocyclo
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
    govet:
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -QF*
        - -ST1003
        - -ST1016
        - -SA1019
    gocyclo:
      min-complexity: 30
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
        path: main.go
      - linters:
          - forbidigo
        source: "nats-server: v%s"
      - linters:
          - forbidigo
        path: server/opts.go
      - linters:
          - forbidigo
        path: _test.go
    paths:
      - .github
      - doc
      - docker
      - logos
      - scripts
      - util
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - .github
      - doc
      - docker
      - logos
      - scripts
      - util
      - third_party$
      - builtin$
      - examples$
